name: PharmaLLM Agent CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PharmaLLM_V1.1/agent_app
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pharma
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pharma_agent_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pharma -d pharma_agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://pharma:ci-only-password@127.0.0.1:5433/pharma_agent_test
      TEST_DATABASE_URL: postgresql+psycopg://pharma:ci-only-password@127.0.0.1:5433/pharma_agent_test
      REDIS_URL: redis://127.0.0.1:6380/15
      TEST_REDIS_URL: redis://127.0.0.1:6380/15
      JWT_SECRET: ci-only-secret-never-use-in-real-deployment-0000000000000000
      MODEL_MODE: fake
      ENABLE_FAULTS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: PharmaLLM_V1.1/agent_app/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python ../../tools/check_public_repo.py
      - run: python -m unittest discover -s ../../tools/tests -v
      - run: node --test tests/web_ui.test.cjs
      - run: ruff check .
      - run: bash scripts/migrate.sh
      - run: pytest -q
