[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-agent"
version = "1.1.0"
description = "Multi-tenant PharmaLLM agent application, independent of model training"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.156.4", "uvicorn==0.54.0",
  "pydantic==2.14.1", "pydantic-settings==2.16.1", "httpx==0.28.1",
  "typing-extensions==4.16.0",
  "langgraph==1.2.16", "langchain-core==1.6.12",
  "langgraph-checkpoint-postgres==3.2.0",
  "SQLAlchemy[asyncio]==2.1.5", "alembic==1.20.0",
  "psycopg[binary,pool]==3.3.6", "psycopg-pool==3.3.3", "pgvector==0.5.1",
  "PyJWT==2.15.1", "pwdlib[argon2]==0.3.1",
  "python-multipart==0.0.32", "PyYAML==6.0.3",
  "celery[redis]==5.6.3",
  "numpy==2.3.5", "scipy==1.15.3", "nibabel==5.3.2",
  "pydicom==3.0.1", "Pillow==12.1.1",
  "opentelemetry-api==1.45.1", "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[project.scripts]
pharma-agent = "pharma_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pharma_agent = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires migrated PostgreSQL and Redis"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
