[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-llm"
version = "0.1.0"
description = "Medical LLM data governance, SFT, evaluation, and serving toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "PharmaLLM contributors" }
]
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
  "tqdm>=4.66",
  "rich>=13.0",
]

[project.optional-dependencies]
data = [
  "pandas>=2.0",
  "datasketch>=1.6",
  "scikit-learn>=1.3",
  "datasets>=2.18",
]
train = [
  "datasets>=2.18",
  "transformers>=4.51",
  "accelerate>=0.30",
  "trl>=0.9",
  "peft>=0.11",
  "deepspeed>=0.14",
  "torch>=2.3",
  "flash-attn>=2.5",
  "tensorboard>=2.16",
  "gpustat>=1.1",
  "psutil>=5.9",
]
serve = [
  "vllm>=0.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "openai>=1.30",
  "gradio>=4.31",
  "psutil>=5.9",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
